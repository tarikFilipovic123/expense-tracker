<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="text-center mb-3">Register</h2>
    <form>
      <input type="text" class="form-control mb-2" placeholder="Full Name" />
      <input type="email" class="form-control mb-2" placeholder="Email" />
      <input type="text" class="form-control mb-2" placeholder="Username" />
      <input type="password" class="form-control mb-2" placeholder="Password" />
      <input type="password" class="form-control mb-2" placeholder="Confirm Password" />
      <button class="btn btn-success w-100">Create Account</button>
    </form>
    <p class="text-center mt-2">
      Already have an account? <a href="#" data-page="login">Login here</a>
    </p>
  </div>
</div>
